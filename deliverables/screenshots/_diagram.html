<!doctype html><meta charset="utf-8"><style>
  :root {
    --bg: #EDEFF0;
    --surface: #FFFFFF;
    --surface-2: #E3E7EA;
    --ink: #171B20;
    --ink-soft: #4E5763;
    --ink-faint: #838B96;
    --border: #D3D8DC;
    --border-strong: #B7BEC5;
    --accent: #33507D;
    --accent-strong: #223B60;
    --accent-wash: #E4E9F1;
    --gold: #B9812A;
    --gold-wash: #F5EAD6;
    --teal: #2A8F86;
    --teal-wash: #E1EFEE;
    --rust: #AE4A2E;
    --rust-wash: #F5E5DF;
    --shadow: 0 1px 2px rgba(23,27,32,.05), 0 6px 20px -8px rgba(23,27,32,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141A; --surface: #171D25; --surface-2: #1E2530;
      --ink: #E7E9EC; --ink-soft: #A2ABB8; --ink-faint: #6C7684;
      --border: #2B3440; --border-strong: #3A4552;
      --accent: #8AAAE0; --accent-strong: #B2CCF3; --accent-wash: #1C2836;
      --gold: #E3AD52; --gold-wash: #2C2415;
      --teal: #55C2B7; --teal-wash: #142623;
      --rust: #E2795A; --rust-wash: #2B1C16;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141A; --surface: #171D25; --surface-2: #1E2530;
    --ink: #E7E9EC; --ink-soft: #A2ABB8; --ink-faint: #6C7684;
    --border: #2B3440; --border-strong: #3A4552;
    --accent: #8AAAE0; --accent-strong: #B2CCF3; --accent-wash: #1C2836;
    --gold: #E3AD52; --gold-wash: #2C2415;
    --teal: #55C2B7; --teal-wash: #142623;
    --rust: #E2795A; --rust-wash: #2B1C16;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.62;
  }
  ::selection { background: var(--accent-wash); color: var(--accent-strong); }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; color: var(--ink); font-weight: 600; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .87em; background: var(--surface-2); padding: .1em .4em; border-radius: 4px; }
  a { color: var(--accent); }

  nav.top {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 4px;
    padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  nav.top .brand { font-family: "Fraunces", serif; font-weight: 600; font-size: 15px; margin-right: 14px; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  nav.top .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: none; }
  nav.top a.tab { font-size: 13px; color: var(--ink-soft); text-decoration: none; white-space: nowrap; padding: 6px 11px; border-radius: 7px; transition: background .15s, color .15s; }
  nav.top a.tab:hover { background: var(--surface-2); color: var(--ink); }

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }
  .wide { max-width: 940px; margin: 0 auto; padding: 0 24px; }

  header.hero { padding: 60px 0 40px; border-bottom: 1px solid var(--border); }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .eyebrow::before { content: ""; width: 22px; height: 1.5px; background: var(--accent); display: inline-block; }
  header.hero h1 { font-size: clamp(32px, 5.2vw, 50px); line-height: 1.06; margin: 0 0 18px; letter-spacing: -0.015em; }
  header.hero .dek { font-size: 18px; color: var(--ink-soft); max-width: 60ch; margin: 0 0 28px; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 12.5px; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; }
  .meta-row b { color: var(--ink-soft); font-weight: 500; }

  section { padding: 50px 0; border-bottom: 1px solid var(--border); }
  .section-head { margin-bottom: 26px; }
  .section-head .eyebrow { margin-bottom: 10px; }
  .section-head h2 { font-size: 27px; margin: 0 0 10px; letter-spacing: -0.01em; }
  .section-head p { color: var(--ink-soft); max-width: 66ch; margin: 0; font-size: 15.5px; }

  p { margin: 0 0 15px; max-width: 68ch; }
  .lead { font-size: 17px; }
  ul.clean { margin: 0 0 16px; padding-left: 20px; max-width: 68ch; }
  ul.clean li { margin-bottom: 8px; }
  ul.clean li::marker { color: var(--accent); }

  .abstract { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; padding: 22px 26px; box-shadow: var(--shadow); }
  .abstract p { margin-bottom: 12px; }
  .abstract p:last-child { margin-bottom: 0; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; margin: 26px 0 8px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 17px; box-shadow: var(--shadow); }
  .tile .big { font-family: "IBM Plex Mono", monospace; font-size: 27px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .tile .cap { font-size: 12px; color: var(--ink-soft); margin-top: 8px; line-height: 1.35; }

  .table-scroll { overflow-x: auto; margin: 18px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 440px; }
  th, td { text-align: left; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); font-weight: 500; }
  td { color: var(--ink); font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: none; }
  tr.hl td { color: var(--accent-strong); font-weight: 600; }
  caption { caption-side: bottom; text-align: left; font-size: 11.5px; color: var(--ink-faint); padding-top: 10px; font-style: italic; }

  .callout { border-left: 3px solid var(--teal); background: var(--teal-wash); padding: 13px 17px; border-radius: 0 8px 8px 0; font-size: 14.5px; margin: 18px 0; }
  .callout b { color: var(--teal); }
  .callout.gold { border-color: var(--gold); background: var(--gold-wash); }
  .callout.gold b { color: var(--gold); }
  .callout.rust { border-color: var(--rust); background: var(--rust-wash); }
  .callout.rust b { color: var(--rust); }

  /* diagram */
  .diagram-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 18px 6px; box-shadow: var(--shadow); overflow-x: auto; margin: 8px 0 4px; }
  .diagram-card svg { display: block; margin: 0 auto; width: 100%; max-width: 600px; height: auto; }
  .dn rect { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.4; }
  .dn.gen rect { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.6; }
  .dn.judge rect { fill: var(--gold-wash); stroke: var(--gold); stroke-width: 1.8; }
  .dn.final rect { fill: var(--teal-wash); stroke: var(--teal); stroke-width: 1.8; }
  .dn .t { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 13px; fill: var(--ink); }
  .dn .s { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--ink-soft); }
  .df { fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
  .dl { fill: none; stroke: var(--rust); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .dcap { font-family: "IBM Plex Sans", sans-serif; font-style: italic; font-size: 11px; fill: var(--ink-faint); }
  .dtag { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; }

  .weights { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 4px; }
  .wchip { display: flex; align-items: baseline; gap: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px 6px 8px; font-size: 12.5px; }
  .wchip .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .wchip .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
  .wchip .l { color: var(--ink-soft); }

  /* phase timeline */
  .phase { position: relative; padding: 0 0 34px 52px; }
  .phase:last-child { padding-bottom: 0; }
  .phase::before { content: ""; position: absolute; left: 17px; top: 38px; bottom: -4px; width: 1.5px; background: var(--border); }
  .phase:last-child::before { display: none; }
  .phase .pn { position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent); font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .phase h3 { font-size: 18.5px; margin: 3px 0 8px; }
  .phase .verdict { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 5px 12px; background: var(--accent-wash); color: var(--accent-strong); border-radius: 8px; font-size: 13px; font-weight: 500; }
  .phase .verdict::before { content: "→"; font-weight: 700; }

  .split { margin: 14px 0; }
  .split .sl { font-size: 12px; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; margin-bottom: 5px; }
  .strack { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .sseg { display: flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: #fff; }

  footer { padding: 34px 0 64px; text-align: center; color: var(--ink-faint); font-size: 12.5px; }
  footer a { color: var(--ink-soft); }

  @media (max-width: 640px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    header.hero { padding: 40px 0 30px; }
  }
